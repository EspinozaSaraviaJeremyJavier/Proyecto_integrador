# Configuraci\u00f3n de conexi\u00f3n a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/reposteria?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estrategias para respetar nombres exactos de tablas y columnas de la BD
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Define el lenguaje SQL espec\u00edfico para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actualiza autom\u00e1ticamente las tablas si hay cambios en las clases Java
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de NetBeans las consultas SQL que ejecuta Spring
spring.jpa.show-sql=true

# Puerto donde corre el servidor Backend
server.port=8081